name: Revisar enlaces

on:
  push:
    branches: [master]
    paths: [README.md, .github/workflows/links.yml]
  pull_request:
    paths: [README.md, .github/workflows/links.yml]
  schedule:
    - cron: "0 9 * * 1" # todos los lunes
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar enlaces e imágenes del README
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,429
            --exclude-mail
            --exclude 'linkedin\.com'
            README.md
          fail: true
